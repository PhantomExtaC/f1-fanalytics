name: LapLogic Weekly Data Engine

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch: # Allows manual trigger button on GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing changes back to the repository
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
          
      - name: Install Dependencies
        run: |
          cd analytics_engine
          python -m pip install --upgrade pip
          pip install pandas fastf1 scikit-learn xgboost matplotlib seaborn  
          
      - name: Execute LapLogic Pipeline
        run: |
          cd analytics_engine
          python main.py
          
      - name: Commit and Push Updated JSONs to React UI
        run: |
          git config --global user.name "LapLogic Data Bot"
          git config --global user.email "bot@laplogic.local"
          
          # Stage the updated database and the newly generated React JSON files
          git add analytics_engine/data/
          
          git add web_app/public/data/
          
          
          # Commit only if changes exist
          git diff --staged --quiet || (git commit -m "Automated Data Engine Update [Weekly]" && git push)
