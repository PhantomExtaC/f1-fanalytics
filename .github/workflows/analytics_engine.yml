name: Fanalytics Weekly Data Engine

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch: # Allows manual trigger button on GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd analytics_engine
          pip install pandas fastf1
          
      - name: Execute Fanalytics Pipeline
        run: |
          cd analytics_engine
          python main.py
          
      - name: Commit and Push Updated JSONs to React UI
        run: |
          git config --global user.name "Fanalytics Data Bot"
          git config --global user.email "bot@fanalytics.local"
          
          # Stage the updated database and the newly generated React JSON files
          git add analytics_engine/data/raw/master_historical.csv
          git add web_app/public/data/*.json
          
          # Commit only if changes exist
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Data Engine Update [Weekly]" && git push)